name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, riscv64]
        python: ["3.12", "3.13", "3.14"]
        include:
          - arch: x64
            target_arch: x86_64
            runner: ubuntu-24.04
          - arch: riscv64
            target_arch: riscv64
            runner: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build ccache

      - name: Build Triton with triton-riscv
        run: ./scripts/build.sh

      - name: Install test dependencies (riscv64)
        if: matrix.arch == 'riscv64'
        run: |
          ./.venv/bin/python -m pip install torch==2.10 --index-url https://ruyirepo.ruyicommunity.cn/pypi/simple

      - name: Install test dependencies
        if: matrix.arch != 'riscv64'
        run: |
          ./.venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Export toolchain environment
        run: |
          echo "TRITON_PLUGIN_DIRS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "LLVM_BINARY_DIR=${GITHUB_WORKSPACE}/.cache/llvm/bin" >> "$GITHUB_ENV"
          echo "LLVM_SYSPATH=${GITHUB_WORKSPACE}/.cache/llvm" >> "$GITHUB_ENV"
          echo "BUDDY_MLIR_BINARY_DIR=${GITHUB_WORKSPACE}/.cache/buddy/bin" >> "$GITHUB_ENV"

      - name: Run lit test
        run: |
          ./.venv/bin/python - <<'PY'
          from pathlib import Path

          lit = Path(".cache/llvm/bin/llvm-lit")
          text = lit.read_text()
          old = "\nfrom lit.main import main\n\nmain()\n"
          new = "\nfrom lit.main import main\n\nif __name__ == \"__main__\":\n    main()\n"
          if old in text:
              lit.write_text(text.replace(old, new))
          PY
          cmake --build "triton/build/cmake.linux-${{ matrix.target_arch }}-cpython-${{ matrix.python }}" --target check-triton-shared-lit-tests

      - name: Run common example test suite
        run: |
          cd triton
          ../.venv/bin/python -m pytest ../python/examples/ \
            --ignore=../python/examples/test_core.py \
            --ignore=../python/examples/test_annotations.py \
            --ignore=../python/examples/flaggems \
            -v

      - name: Run flaggems example test suite
        if: matrix.arch == 'riscv64'
        run: |
          cd triton
          ../.venv/bin/python -m pytest ../python/examples/flaggems \
            -v
