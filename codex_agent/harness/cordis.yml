# Triton-RISCV composition for deepseek-harness-sdk 0.1.1rc1.
# Keep the SDK JSON-RPC server: the Python client communicates through it.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# The Harness MCP client launches our Python server and registers its tools as
# mcp__triton_riscv__<tool-name> model-facing functions.
- id: mcp-triton-riscv
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: triton_riscv
    transport: stdio
    command: !!js process.env.TRITON_RISCV_MCP_PYTHON
    args: ['-m', 'codex_agent.harness.mcp_server']
    env:
      TRITON_RISCV_REPO_ROOT: !!js process.env.DSH_CWD ?? process.cwd()
      TRITON_RISCV_ALLOW_VALIDATION: !!js process.env.TRITON_RISCV_ALLOW_VALIDATION ?? '0'
      TRITON_RISCV_ALLOW_REPAIR_APPLY: !!js process.env.TRITON_RISCV_ALLOW_REPAIR_APPLY ?? '0'
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    toolCallTimeoutMs: 30000
    failOnStartupError: true
